<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img"><title>On Buildroot the address settings live in the U-Boot environment</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a9aa3"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8aa2ff"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a8a"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5fd39a"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f4f4f6"/></marker></defs><rect x="20" y="70" width="210" height="80" rx="8" fill="#232a47" stroke="#8aa2ff" stroke-width="1.5"/><text x="125.0" y="98.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">U-Boot environment</text><text x="125.0" y="117.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">128 KB in QSPI flash</text><text x="125.0" y="134.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">/dev/mtd1</text><line x1="230" y1="110" x2="318" y2="110" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><text x="274" y="100" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">every boot</text><rect x="320" y="76" width="170" height="68" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="405.0" y="106.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">S40network</text><text x="405.0" y="125.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">reads it with fw_printenv</text><line x1="490" y1="110" x2="548" y2="44" stroke="#9a9aa3" stroke-width="1.6" marker-end="url(#a-muted)"/><rect x="550" y="22" width="190" height="44" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="645.0" y="49.0" font-size="14" font-weight="600" fill="#cfcfd6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">/etc/network/interfaces</text><line x1="490" y1="110" x2="548" y2="110" stroke="#9a9aa3" stroke-width="1.6" marker-end="url(#a-muted)"/><rect x="550" y="88" width="190" height="44" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="645.0" y="115.0" font-size="14" font-weight="600" fill="#cfcfd6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">/etc/udhcpd.conf</text><line x1="490" y1="110" x2="548" y2="176" stroke="#9a9aa3" stroke-width="1.6" marker-end="url(#a-muted)"/><rect x="550" y="154" width="190" height="44" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="645.0" y="181.0" font-size="14" font-weight="600" fill="#cfcfd6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">/opt/config.txt</text><text x="645" y="214" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">generated: edits here are lost at reboot