<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img"><title>The five steps of the --verify check</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a9aa3"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8aa2ff"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a8a"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5fd39a"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f4f4f6"/></marker></defs><rect x="20.0" y="14" width="148.0" height="80" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="94.0" y="42.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Blank</text><text x="94.0" y="61.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">bins within about</text><text x="94.0" y="78.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">±5 kHz of DC</text><line x1="170.0" y1="54.0" x2="196.0" y2="54.0" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="198.0" y="14" width="148.0" height="80" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="272.0" y="42.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Find</text><text x="272.0" y="61.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">the strongest</text><text x="272.0" y="78.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">tone</text><line x1="348.0" y1="54.0" x2="374.0" y2="54.0" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="376.0" y="14" width="148.0" height="80" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="450.0" y="42.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">De-rotate</text><text x="450.0" y="61.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">by it: the tone</text><text x="450.0" y="78.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">stands still</text><line x1="526.0" y1="54.0" x2="552.0" y2="54.0" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="554.0" y="14" width="148.0" height="80" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="628.0" y="42.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Average</text><text x="628.0" y="61.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">the phase over</text><text x="628.0" y="78.0" font-size="12" font-weight="400" fill="#9a9aa3" text-ancho