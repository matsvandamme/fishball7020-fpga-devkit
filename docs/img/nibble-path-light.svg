<svg xmlns="http://www.w3.org/2000/svg" width="880" height="940" viewBox="0 0 880 940" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="880" height="940" fill="#fcfcfb"/>
<defs><marker id="alight" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#8a8985"/></marker><marker id="slight" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#eb6834"/></marker><marker id="clight" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#2a78d6"/></marker></defs>
<rect x="28" y="70" width="824" height="96" rx="10" fill="#e6e5e1" fill-opacity="0.55" stroke="none"/>
<text x="848" y="157" font-size="11.5" fill="#8a8985" text-anchor="end">processing system</text>
<rect x="28" y="172" width="824" height="464" rx="10" fill="#e6e5e1" fill-opacity="0.55" stroke="none"/>
<text x="848" y="627" font-size="11.5" fill="#8a8985" text-anchor="end">FPGA fabric (PL)</text>
<rect x="28" y="642" width="824" height="182" rx="10" fill="#e6e5e1" fill-opacity="0.55" stroke="none"/>
<text x="848" y="815" font-size="11.5" fill="#8a8985" text-anchor="end">off-chip — AD9361 and header</text>
<text x="44" y="34" font-size="17" font-weight="600" fill="#0b0b0b">Where the low four bits leave the transmit path</text>
<text x="44" y="56" font-size="12.5" fill="#52514e">Box names are real instances in system_bd.tcl. The two paths split at util_upack2; the bands say what is on which chip.</text>
<rect x="44" y="86" width="310" height="54" rx="7" fill="#fcfcfb" stroke="#d8d7d2" stroke-width="1.4"/>
<text x="60" y="109" font-size="14" font-weight="600" fill="#0b0b0b">Your program</text>
<text x="60" y="128" font-size="12" fill="#52514e">16-bit I/Q words in a DDR buffer</text>
<rect x="44" y="180" width="310" height="54" rx="7" fill="#fcfcfb" stroke="#d8d7d2" stroke-width="1.4"/>
<text x="60" y="203" font-size="14" font-weight="600" fill="#0b0b0b">TX DMA</text>
<text x="60" y="222" font-size="12" fill="#52514e">axi_ad9361_dac_dma</text>
<rect x="44" y="274" width="310" height="54" rx="7" fill="#fcfcfb" stroke="#eb6834" stroke-width="2.2"/>
<text x="60" y="297" font-size="14" font-weight="600" fill="#0b0b0b">util_upack2</text>
<text x="60" y="316" font-size="12" fill="#52514e">the sample stands at its output</text>
<rect x="44" y="462" width="310" height="54" rx="7" fill="#fcfcfb" stroke="#d8d7d2" stroke-width="1.4"/>
<text x="60" y="485" font-size="14" font-weight="600" fill="#0b0b0b">FIR interpolator</text>
<text x="60" y="504" font-size="12" fill="#52514e">bypassed in normal use</text>
<rect x="44" y="556" width="310" height="54" rx="7" fill="#fcfcfb" stroke="#d8d7d2" stroke-width="1.4"/>
<text x="60" y="579" font-size="14" font-weight="600" fill="#0b0b0b">axi_ad9361</text>
<text x="60" y="598" font-size="12" fill="#52514e">DAC core, then LVDS to the chip</text>
<rect x="44" y="650" width="310" height="54" rx="7" fill="#fcfcfb" stroke="#d8d7d2" stroke-width="1.4"/>
<text x="60" y="673" font-size="14" font-weight="600" fill="#0b0b0b">AD9361</text>
<text x="60" y="692" font-size="12" fill="#52514e">12-bit DAC — takes bits [15:4]</text>
<rect x="44" y="744" width="310" height="54" rx="7" fill="#fcfcfb" stroke="#8a8985" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="60" y="767" font-size="14" font-weight="600" fill="#0b0b0b">RF out</text>
<text x="60" y="786" font-size="12" fill="#52514e">antenna port</text>
<rect x="500" y="86" width="310" height="54" rx="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.4"/>
<text x="516" y="109" font-size="14" font-weight="600" fill="#0b0b0b">EMIO GPIO 21:18</text>
<text x="516" y="128" font-size="12" fill="#52514e">what the pins do when the flag is 0</text>
<rect x="500" y="180" width="310" height="54" rx="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.4"/>
<text x="516" y="203" font-size="14" font-weight="600" fill="#0b0b0b">GP_CONTROL bit 1</text>
<text x="516" y="222" font-size="12" fill="#52514e">AXI 0xBC — the enable flag</text>
<rect x="500" y="274" width="310" height="54" rx="7" fill="#fcfcfb" stroke="#eb6834" stroke-width="2.2"/>
<text x="516" y="297" font-size="14" font-weight="600" fill="#0b0b0b">tx_gpio_bitmap</text>
<text x="516" y="316" font-size="12" fill="#52514e">one capture per sample, then choose</text>
<rect x="500" y="368" width="310" height="54" rx="7" fill="#fcfcfb" stroke="#eb6834" stroke-width="2.2"/>
<text x="516" y="391" font-size="14" font-weight="600" fill="#0b0b0b">ad_iobuf</text>
<text x="516" y="410" font-size="12" fill="#52514e">one per pin, in system_top.v</text>
<rect x="500" y="650" width="310" height="54" rx="7" fill="#fcfcfb" stroke="#eb6834" stroke-width="2.2"/>
<text x="516" y="673" font-size="14" font-weight="600" fill="#0b0b0b">JP5 pins 7, 9, 11, 13</text>
<text x="516" y="692" font-size="12" fill="#52514e">balls V10, U9, U10, T9</text>
<path d="M199.0,140 L199.0,176" stroke="#8a8985" stroke-width="1.8" fill="none" marker-end="url(#alight)"/>
<path d="M199.0,234 L199.0,270" stroke="#8a8985" stroke-width="1.8" fill="none" marker-end="url(#alight)"/>
<path d="M199.0,516 L199.0,552" stroke="#8a8985" stroke-width="1.8" fill="none" marker-end="url(#alight)"/>
<path d="M199.0,610 L199.0,646" stroke="#8a8985" stroke-width="1.8" fill="none" marker-end="url(#alight)"/>
<path d="M199.0,704 L199.0,740" stroke="#8a8985" stroke-width="1.8" fill="none" marker-end="url(#alight)"/>
<path d="M199.0,328 L199.0,458" stroke="#8a8985" stroke-width="1.8" fill="none" marker-end="url(#alight)"/>
<text x="211.0" y="362" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">bits [15:4] — the only ones the DAC reads</text>
<text x="211.0" y="380" font-size="11.5" fill="#8a8985" text-anchor="start" font-weight="normal">bits [3:0] carry on down and are dropped here</text>
<path d="M354,301.0 L496,301.0" stroke="#eb6834" stroke-width="1.8" fill="none" marker-end="url(#slight)"/>
<text x="370" y="291.0" font-size="13" fill="#eb6834" text-anchor="start" font-weight="600">bits [3:0]</text>
<text x="370" y="325.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">the tap</text>
<path d="M655.0,140 L655.0,176" stroke="#2a78d6" stroke-width="1.8" fill="none" marker-end="url(#clight)" stroke-dasharray="6 5"/>
<path d="M655.0,234 L655.0,270" stroke="#2a78d6" stroke-width="1.8" fill="none" marker-end="url(#clight)" stroke-dasharray="6 5"/>
<text x="667.0" y="162" font-size="11.5" fill="#2a78d6" text-anchor="start" font-weight="normal">flag = 1</text>
<text x="667.0" y="256" font-size="11.5" fill="#2a78d6" text-anchor="start" font-weight="normal">flag = 0</text>
<path d="M655.0,328 L655.0,364" stroke="#eb6834" stroke-width="1.8" fill="none" marker-end="url(#slight)"/>
<path d="M655.0,422 L655.0,646" stroke="#eb6834" stroke-width="1.8" fill="none" marker-end="url(#slight)"/>
<text x="667.0" y="486" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">out through the package ball</text>
<text x="211.0" y="627" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">LVDS, off the FPGA</text>
<rect x="44" y="828" width="792" height="78" rx="7" fill="#e6e5e1" stroke="none"/>
<text x="60" y="852" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">The pins lead the RF by a fixed offset.</text>
<text x="60" y="872" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Capture strobe: fifo_rd_valid | fifo_rd_underflow — never fifo_rd_en, which asks one clock too early.</text>
<text x="60" y="891" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">A pad changes one clock after the tap. The matching RF still has the interpolator, the AD9361 and the DAC ahead of it.</text>
</svg>