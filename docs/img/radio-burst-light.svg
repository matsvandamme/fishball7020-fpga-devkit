<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img"><title>A one-shot burst on a trigger</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4069FF"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d6293e"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a9e5c"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#141415"/></marker></defs><rect x="20.0" y="14" width="192.5" height="80" rx="8" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><text x="116.25" y="42.0" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Trigger</text><text x="116.25" y="61.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">UDP datagram, or</text><text x="116.25" y="78.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">GPIO rising edge</text><line x1="214.5" y1="54.0" x2="240.5" y2="54.0" stroke="#4069FF" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="242.5" y="14" width="192.5" height="80" rx="8" fill="#e9eeff" stroke="#4069FF" stroke-width="1.5"/><text x="338.75" y="42.0" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">tx-burst</text><text x="338.75" y="61.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">on the board: one</text><text x="338.75" y="78.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">memory copy, one push</text><line x1="437.0" y1="54.0" x2="463.0" y2="54.0" stroke="#4069FF" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="465.0" y="14" width="192.5" height="80" rx="8" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><text x="561.25" y="42.0" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">DMA</text><text x="561.25" y="61.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">plays the buffer</text><text x="561.25" y="78.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">once</text><line x1="659.5" y1="54.0" x2="685.5" y2="54.0" stroke="#4069FF" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="687.5" y="14" width="192.5" height="80" rx="8" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><text x="783.75" y="42.0" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">DAC</text><text x="783.75" y="61.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">outputs zeros until</text><text x="783.75" y="78.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">the next trigger</text></svg>
