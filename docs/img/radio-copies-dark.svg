<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220" role="img"><title>iiod copies each sample twice; zc-stream maps the DMA buffer and copies once</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a9aa3"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8aa2ff"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a8a"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5fd39a"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f4f4f6"/></marker></defs><text x="20" y="26" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">iiod: two copies, one thread</text><rect x="20" y="40" width="170" height="56" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="105.0" y="73.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">DMA buffer</text><line x1="190" y1="68" x2="318" y2="68" stroke="#ff7a8a" stroke-width="1.6" marker-end="url(#a-danger)"/><text x="254.0" y="60.0" font-size="12" font-weight="400" fill="#ff7a8a" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">copy 1</text><rect x="320" y="40" width="190" height="56" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="415.0" y="73.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">iiod's memory</text><line x1="510" y1="68" x2="638" y2="68" stroke="#ff7a8a" stroke-width="1.6" marker-end="url(#a-danger)"/><text x="574.0" y="60.0" font-size="12" font-weight="400" fill="#ff7a8a" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">copy 2</text><rect x="640" y="40" width="160" height="56" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="720.0" y="73.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">socket</text><text x="20" y="136" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">zc-stream: one copy</text><rect x="20" y="150" width="170" height="56" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="105.0" y="183.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">DMA buffer</text><line x1="190" y1="178" x2="318" y2="178" stroke="#5fd39a" stroke-width="1.6" marker-end="url(#a-ok)"/><text x="254.0" y="170.0" font-size="12" font-weight="400" fill="#5fd39a" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">mapped, no copy</text><rect x="320" y="150" width="190" height="56" rx="8" fill="#232a47" stroke="#8aa2ff" stroke-width="1.5"/><text x="415.0" y="183.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">zc-stream</text><line x1="510" y1="178" x2="638" y2="178" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><text x="574.0" y="170.0" font-size="12" font-weight="400