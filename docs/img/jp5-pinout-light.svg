<text x="368" y="372" font-size="11.5" text-anchor="start" fill="#8a8985">18</text>
<text x="394" y="372" font-size="11.5" font-weight="400" text-anchor="start" fill="#52514e" font-family="DejaVu Sans Mono, monospace">1V8_IO7_N</text>
<circle cx="292" cy="399" r="5.5" fill="#8a8985"/>
<text x="276" y="403" font-size="11.5" text-anchor="end" fill="#8a8985">19</text>
<text x="250" y="403" font-size="11.5" font-weight="400" text-anchor="end" fill="#52514e" font-family="DejaVu Sans Mono, monospace">AD936X_SYNC</text>
<circle cx="352" cy="399" r="5.5" fill="#0b0b0b"/>
<text x="368" y="403" font-size="11.5" text-anchor="start" fill="#8a8985">20</text>
<text x="394" y="403" font-size="11.5" font-weight="400" text-anchor="start" fill="#0b0b0b" font-family="DejaVu Sans Mono, monospace">GND</text>
<text x="292" y="86.5" font-size="11" text-anchor="middle" fill="#2a78d6">square pad = pin 1  ▼</text>
<text x="30" y="461.5" font-size="11.5" font-weight="600" fill="#0b0b0b">Finding pin 1 on the board:</text>
<text x="30" y="477.5" font-size="11.5" font-weight="400" fill="#52514e">odd pins 1–19 are one column, even pins 2–20 the other. Pin 1 is</text>
<text x="30" y="493.5" font-size="11.5" font-weight="400" fill="#52514e">normally a SQUARE pad on the underside, or marked by a silkscreen</text>
<text x="30" y="509.5" font-size="11.5" font-weight="400" fill="#52514e">dot, triangle or “1”. Confirm before probing — this drawing cannot</text>
<text x="30" y="525.5" font-size="11.5" font-weight="400" fill="#52514e">tell you which way round the connector sits on your board.</text>
<text x="30" y="557.5" font-size="11.5" font-weight="600" fill="#0b0b0b">Logic analyser: ground on pin 2 or 20, probes on 7, 9, 11, 13.</text>
<text x="30" y="573.5" font-size="11.5" font-weight="400" fill="#52514e">Those four are 3.3 V LVCMOS. The 1V8_* pairs are 1.8 V — do not</text>
<text x="30" y="589.5" font-size="11.5" font-weight="400" fill="#52514e">drive them at 3.3 V. Pins 1/3/5 are power rails, not signals.</text>
</svg>