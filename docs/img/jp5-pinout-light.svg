<text x="276" y="372" font-size="11.5" text-anchor="end" fill="#8a8985">17</text>
<text x="250" y="372" font-size="11.5" font-weight="400" text-anchor="end" fill="#52514e" font-family="DejaVu Sans Mono, monospace">PTT</text>
