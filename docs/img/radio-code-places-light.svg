<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img"><title>Three questions that decide where your code runs</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4069FF"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d6293e"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a9e5c"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#141415"/></marker></defs><rect x="20" y="16" width="330" height="64" rx="8" fill="#e9eeff" stroke="#4069FF" stroke-width="1.5"/><text x="185.0" y="44.5" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Can my PC keep up?</text><text x="185.0" y="63.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">streaming plateaus near 44 MB/s</text><line x1="350" y1="48" x2="478" y2="48" stroke="#1a9e5c" stroke-width="1.6" marker-end="url(#a-ok)"/><text x="414.0" y="40.0" font-size="12" font-weight="400" fill="#1a9e5c" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">yes</text><rect x="480" y="16" width="320" height="64" rx="8" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><text x="640.0" y="53.0" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1. On your PC</text><line x1="185" y1="80" x2="185" y2="106" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#a-muted)"/><text x="205" y="98" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">no</text><rect x="20" y="108" width="330" height="64" rx="8" fill="#e9eeff" stroke="#4069FF" stroke-width="1.5"/><text x="185.0" y="136.5" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Must it run with no PC,</text><text x="185.0" y="155.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">or is the data too big to ship?</text><line x1="350" y1="140" x2="478" y2="140" stroke="#1a9e5c" stroke-width="1.6" marker-end="url(#a-ok)"/><text x="414.0" y="132.0" font-size="12" font-weight="400" fill="#1a9e5c" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">yes</text><rect x="480" y="108" width="320" height="64" rx="8" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><text x="640.0" y="145.0" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2. On the board</text><line x1="185" y1="172" x2="185" y2="198" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#a-muted)"/><text x="205" y="190" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">no</text><rect x="20" y="200" width="330" height="64" rx="8" fill="#e9eeff" stroke="#4069FF" stroke-width="1.5"/><text x="185.0" y="228.5" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A new sysfs file, or act</text><text x="185.0" y="247.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">between samples?</text><line x1="350" y1="232" x2="478" y2="232" stroke="#1a9e5c" stroke-width="1.6" marker-end="url(#a-ok)"/><text x="414.0" y="224.0" font-size="12" font-weight="400" fill="#1a9e5c" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">yes</text><rect x="480" y="200" width="320" height="64" rx="8" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><text x="640.0" y="237.0" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">3. In the kernel</text><line x1="185" y1="264" x2="185" y2="284" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#a-muted)"/><text x="205" y="280" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">no</text><rect x="20" y="286" width="330" height="60" rx="8" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><text x="185.0" y="312.5" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">4. In the FPGA</text><text x="185.0" y="331.5" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">high input rate, small output</text></svg>
