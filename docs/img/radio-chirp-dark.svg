<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 110" width="940" height="110" role="img"><title>chirp-view's signal path, from the PC round the bench loop and back</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a9aa3"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8aa2ff"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a8a"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5fd39a"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f4f4f6"/></marker></defs><rect x="20.0" y="14" width="144.8" height="80" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="92.4" y="42.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">PC</text><text x="92.4" y="61.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">one period</text><text x="92.4" y="78.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">of the sweep</text><line x1="166.8" y1="54.0" x2="206.8" y2="54.0" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><text x="186.8" y="45.0" font-size="11.5" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">upload</text><rect x="208.8" y="14" width="144.8" height="80" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="281.20000000000005" y="42.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Cyclic buffer</text><text x="281.20000000000005" y="61.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">replayed</text><text x="281.20000000000005" y="78.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">by the FPGA</text><line x1="355.6" y1="54.0" x2="395.6" y2="54.0" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="397.6" y="14" width="144.8" height="80" rx="8" fill="#232a47" stroke="#8aa2ff" stroke-width="1.5"/><text x="470.0" y="42.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The loop</text><text x="470.0" y="61.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">TX1 → 20 dB pad</text><text x="470.0" y="78.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">→ RX1</text><line x1="544.4000000000001" y1="54.0" x2="584.4000000000001" y2="54.0" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="586.4000000000001" y="14" width="144.8" height="80" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="658.8000000000001" y="42.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">zc-stream</text><text x="658.8000000000001" y="61.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">8-bit,</text><text x="658.8000000000001" y="78.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">20 MS/s</text><line x1="733.2" y1="54.0" x2="773.2" y2="54.0" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="775.2" y="14" width="144.8" height="80" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="847.6" y="42.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">PC</text><text x="847.6" y="61.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">receiver process:</text><text x="847.6" y="78.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">window and sound</text></svg>
