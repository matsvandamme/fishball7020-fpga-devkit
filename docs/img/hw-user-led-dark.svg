<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="860" height="210" role="img"><title>What drives the USER LED</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a9aa3"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8aa2ff"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a8a"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5fd39a"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f4f4f6"/></marker></defs><rect x="20" y="20" width="250" height="62" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="145.0" y="47.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A TX attenuation change</text><text x="145.0" y="66.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">ad9361_set_tx_atten()</text><line x1="270" y1="51" x2="328" y2="51" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="330" y="14" width="200" height="74" rx="8" fill="#232a47" stroke="#8aa2ff" stroke-width="1.5"/><text x="430.0" y="39.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">tx-active trigger</text><text x="430.0" y="58.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">lit: a chain is out of mute</text><text x="430.0" y="75.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">dark: both at −89.75 dB</text><line x1="530" y1="51" x2="618" y2="51" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="620" y="20" width="220" height="62" rx="8" fill="#17302a" stroke="#5fd39a" stroke-width="1.5"/><text x="730.0" y="47.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">USER LED</text><text x="730.0" y="66.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">led0:green, PS MIO pin 0</text><rect x="330" y="122" width="200" height="74" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="430.0" y="147.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Your own setting</text><text x="430.0" y="166.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">trigger and brightness</text><text x="430.0" y="183.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">in /sys/class/leds</text><line x1="530" y1="159" x2="700" y2="84" stroke="#9a9aa3" stroke-width="1.6" marker-end="url(#a-muted)"/><rect x="20" y="122" width="250" height="74" rx="8" fill="#3a1d22" stroke="#ff7a8a" stroke-width="1.5"/><text x="145.0" y="147.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Your HDL</text><text x="145.0" y="166.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">cannot drive it: MIO pins are</text><text x="145.0" y="183.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">not routed into the fabric</text></svg>
