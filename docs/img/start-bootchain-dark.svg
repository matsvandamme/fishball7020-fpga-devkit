<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 86" width="900" height="86" role="img"><title>The boot chain, from BootROM to the root filesystem</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a9aa3"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8aa2ff"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a8a"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5fd39a"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f4f4f6"/></marker></defs><rect x="20.0" y="14" width="125.0" height="58" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="82.5" y="39.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">BootROM</text><text x="82.5" y="58.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">in silicon</text><line x1="147.0" y1="43" x2="165.0" y2="43" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="167.0" y="14" width="125.0" height="58" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="229.5" y="39.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">FSBL</text><text x="229.5" y="58.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">on-chip RAM</text><line x1="294.0" y1="43" x2="312.0" y2="43" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="314.0" y="14" width="125.0" height="58" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="376.5" y="39.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">bitstream</text><text x="376.5" y="58.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">into the FPGA</text><line x1="441.0" y1="43" x2="459.0" y2="43" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="461.0" y="14" width="125.0" height="58" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="523.5" y="39.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">U-Boot</text><text x="523.5" y="58.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">in DDR</text><line x1="588.0" y1="43" x2="606.0" y2="43" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="608.0" y="14" width="125.0" height="58" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="670.5" y="39.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">kernel + DTB</text><text x="670.5" y="58.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">in DDR</text><line x1="735.0" y1="43" x2="753.0" y2="43" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="755.0" y="14" width="125.0" height="58" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="817.5" y="39.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">root filesystem</text><text x="817.5" y="58.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">RAM or ext4</text></svg>
