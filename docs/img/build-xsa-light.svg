<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 250" width="790" height="250" role="img"><title>The FPGA half of a build comes from Vivado or from an XSA</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4069FF"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d6293e"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a9e5c"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#141415"/></marker></defs><text x="20" y="26" font-size="14" font-weight="600" fill="#141415" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The FPGA half: build it, or take it from an XSA</text><rect x="20" y="44" width="230" height="74" rx="8" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><text x="135.0" y="69.0" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Vivado 2022.2</text><text x="135.0" y="88.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">about 50 GB installed,</text><text x="135.0" y="105.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">20 to 70 min of every build</text><rect x="20" y="150" width="230" height="74" rx="8" fill="#e6f6ee" stroke="#1a9e5c" stroke-width="1.5"/><text x="135.0" y="175.0" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">An XSA you already have</text><text x="135.0" y="194.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">a release's system_top.xsa,</text><text x="135.0" y="211.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">or one saved from a full build</text><rect x="330" y="97" width="150" height="74" rx="8" fill="#e9eeff" stroke="#4069FF" stroke-width="1.5"/><text x="405.0" y="122.0" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The XSA</text><text x="405.0" y="141.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">system_top.bit</text><text x="405.0" y="158.0" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">ps7_init.c</text><line x1="250" y1="81" x2="328" y2="120" stroke="#6e6e73" stroke-width="1.6" marker-end="url(#a-muted)"/><line x1="250" y1="187" x2="328" y2="148" stroke="#1a9e5c" stroke-width="1.6" marker-end="url(#a-ok)"/><text x="292" y="84" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">builds</text><text x="292" y="196" font-size="12" font-weight="400" fill="#1a9e5c" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">--xsa</text><rect x="560" y="60" width="210" height="148" rx="8" fill="#f8f8f8" stroke="#c9c9cf" stroke-width="1.5"/><text x="665.0" y="139.0" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"></text><text x="665" y="86" font-size="14" font-weight="600" fill="#141415" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The rest of the build</text><text x="665" y="110" font-size="12.5" font-weight="400" fill="#3c3c43" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">FSBL</text><text x="665" y="129" font-size="12.5" font-weight="400" fill="#3c3c43" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">U-Boot</text><text x="665" y="148" font-size="12.5" font-weight="400" fill="#3c3c43" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">kernel</text><text x="665" y="167" font-size="12.5" font-weight="400" fill="#3c3c43" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">root filesystem</text><text x="665" y="186" font-size="12.5" font-weight="400" fill="#3c3c43" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">BOOT.bin</text><line x1="480" y1="134" x2="558" y2="134" stroke="#4069FF" stroke-width="1.6" marker-end="url(#a-accent)"/><text x="665" y="228" font-size="12" font-weight="400" fill="#6e6e73" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">minutes, nothing from AMD installed</text></svg>
