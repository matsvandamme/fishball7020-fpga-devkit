<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img"><title>A transmit port joined to a receive port through a 20 dB attenuator</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a9aa3"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8aa2ff"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a8a"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5fd39a"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f4f4f6"/></marker></defs><text x="20" y="28" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">With the attenuator</text><rect x="20" y="44" width="150" height="64" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="95.0" y="72.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">TX1A</text><text x="95.0" y="91.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">about +19 dBm out</text><line x1="170" y1="76" x2="300" y2="76" stroke="#9a9aa3" stroke-width="1.6" marker-end="url(#a-muted)"/><text x="235.0" y="68.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">+19 dBm</text><rect x="300" y="44" width="160" height="64" rx="8" fill="#232a47" stroke="#8aa2ff" stroke-width="1.5"/><text x="380.0" y="72.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">20 dB attenuator</text><text x="380.0" y="91.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">at least 20 dB</text><line x1="460" y1="76" x2="590" y2="76" stroke="#5fd39a" stroke-width="1.6" marker-end="url(#a-ok)"/><text x="525.0" y="68.0" font-size="12" font-weight="400" fill="#5fd39a" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">about −1 dBm</text><rect x="590" y="44" width="150" height="64" rx="8" fill="#17302a" stroke="#5fd39a" stroke-width="1.5"/><text x="665.0" y="72.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">RX1A</text><text x="665.0" y="91.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">survives +2.5 dBm</text><text x="20" y="158" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Without it</text><rect x="20" y="174" width="150" height="56" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="95.0" y="198.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">TX1A</text><text x="95.0" y="217.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">about +19 dBm out</text><line x1="170" y1="202" x2="590" y2="202" stroke="#ff7a8a" stroke-width="1.6" marker-end="url(#a-danger)"/><text x="380.0" y="194.0" font-size="12" font-weight="400" fill="#ff7a8a" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">+19 dBm, about 16 dB over the limit</text><rect x="590" y="174" width="150" height="56" rx="8" fill="#3a1d22" stroke="#ff7a8a" stroke-width="1.5"/><text x="665.0" y="198.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">RX1A</text><text x="665.0" y="217.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">destroyed</text></svg>
