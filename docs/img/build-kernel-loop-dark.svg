<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 170" width="790" height="170" role="img"><title>The kernel loop: edit, build uImage, flash it, read dmesg</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a9aa3"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8aa2ff"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a8a"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5fd39a"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f4f4f6"/></marker></defs><rect x="20" y="20" width="170" height="74" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="105.0" y="53.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Edit the driver</text><text x="105.0" y="72.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">add dev_warn()</text><line x1="192" y1="57.0" x2="211" y2="57.0" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="213" y="20" width="170" height="74" rx="8" fill="#232a47" stroke="#8aa2ff" stroke-width="1.5"/><text x="298.0" y="53.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Build uImage</text><text x="298.0" y="72.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">about two minutes</text><line x1="385" y1="57.0" x2="404" y2="57.0" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="406" y="20" width="170" height="74" rx="8" fill="#17302a" stroke="#5fd39a" stroke-width="1.5"/><text x="491.0" y="45.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">flash --kernel-only</text><text x="491.0" y="64.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">back in about</text><text x="491.0" y="81.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">fifteen seconds</text><line x1="578" y1="57.0" x2="597" y2="57.0" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="599" y="20" width="170" height="74" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="684.0" y="53.5" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Read dmesg</text><text x="684.0" y="72.5" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">on the board</text><path d="M 684 96 L 684 136 L 105 136 L 105 98" fill="none" stroke="#9a9aa3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-muted)"/><text x="395" y="156" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">and again</text></svg>
