<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 132" width="790" height="132" role="img"><title>The build path: doctor, setup, build, verify, flash</title><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a9aa3"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8aa2ff"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a8a"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5fd39a"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f4f4f6"/></marker></defs><rect x="20" y="14" width="132" height="74" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="86.0" y="39.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">doctor</text><text x="86.0" y="58.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">can this</text><text x="86.0" y="75.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">machine build?</text><line x1="154" y1="51.0" x2="172" y2="51.0" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="174" y="14" width="132" height="74" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="240.0" y="39.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">setup</text><text x="240.0" y="58.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">fetch the sources,</text><text x="240.0" y="75.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">apply the patches</text><line x1="308" y1="51.0" x2="326" y2="51.0" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="328" y="14" width="132" height="74" rx="8" fill="#232a47" stroke="#8aa2ff" stroke-width="1.5"/><text x="394.0" y="39.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">build</text><text x="394.0" y="58.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">the SD-card files,</text><text x="394.0" y="75.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">into output/</text><line x1="462" y1="51.0" x2="480" y2="51.0" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="482" y="14" width="132" height="74" rx="8" fill="#1f1f23" stroke="#4a4a54" stroke-width="1.5"/><text x="548.0" y="39.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">verify</text><text x="548.0" y="58.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">is the build sane?</text><text x="548.0" y="75.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">--board: is it running?</text><line x1="616" y1="51.0" x2="634" y2="51.0" stroke="#8aa2ff" stroke-width="1.6" marker-end="url(#a-accent)"/><rect x="636" y="14" width="132" height="74" rx="8" fill="#17302a" stroke="#5fd39a" stroke-width="1.5"/><text x="702.0" y="39.0" font-size="14" font-weight="600" fill="#f4f4f6" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">flash</text><text x="702.0" y="58.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">over the network,</text><text x="702.0" y="75.0" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">md5-verified</text><text x="20" y="116" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="start" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Each is one ./devkit command, run from the repo root.</text></svg>
