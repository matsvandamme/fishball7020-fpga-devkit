name: Verify patches apply cleanly

# This does NOT run the actual firmware build (that needs Vivado/Vitis,
# which can't reasonably run on a hosted GitHub Actions runner). It only
# checks the cheap, fast thing a hosted runner *can* verify: that
# setup.sh's clone-and-patch step still works. That catches upstream
# rewriting/force-pushing its history (setup.sh pins an exact commit, so
# this mainly guards against that commit disappearing) and catches any
# new patch in patches/ that doesn't actually apply - without needing an
# 80GB+ Vivado install in CI.

on:
  push:
    paths:
      - "firmware/patches/**"
      - "firmware/scripts/setup.sh"
      - ".github/workflows/verify-patches.yml"
  pull_request:
    paths:
      - "firmware/patches/**"
      - "firmware/scripts/setup.sh"
  schedule:
    # Weekly, so upstream disappearing/force-pushing is caught even when
    # nobody's actively touching this repo.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run setup.sh (clone upstream + apply patches)
        run: ./firmware/scripts/setup.sh
      - name: Confirm the device tree patch actually landed
        run: |
          test -f firmware/src/linux/arch/arm/boot/dts/zynq-pluto-sdr-fishball.dts
      - name: Confirm the TX safeguard and serial fallback landed
        run: |
          grep -q cf_axi_dds_tx_rf_mute firmware/src/linux/drivers/iio/frequency/cf_axi_dds.c
          grep -q ad9361_tx_lo_powerdown firmware/src/linux/drivers/iio/adc/ad9361.h
          grep -q 'mac_seed=' firmware/src/buildroot/board/pluto/S23udc
          grep -q ad9361_tx_is_muted firmware/src/linux/drivers/iio/adc/ad9361.h
          grep -q 'ad9361_tx_is_muted(phy) && ad9361_tx_mute' \
            firmware/src/linux/drivers/iio/frequency/cf_axi_dds.c
      - name: Confirm the GPIO lines are named in the device tree
        run: |
          grep -q gpio-line-names firmware/src/linux/arch/arm/boot/dts/zynq-pluto-sdr-fishball.dts
          grep -q sample_gpio0 firmware/src/linux/arch/arm/boot/dts/zynq-pluto-sdr-fishball.dts
      - name: Confirm the sample-locked GPIO feature landed
        run: |
          grep -q tx_gpio_bitmap firmware/src/hdl/projects/pluto/system_bd.tcl
          test -f firmware/src/hdl/projects/pluto/tx_gpio_bitmap.v
          grep -q 'PACKAGE_PIN  V10' firmware/src/hdl/projects/pluto/system_constr.xdc
          grep -q tx_sample_gpio_en firmware/src/linux/drivers/iio/frequency/cf_axi_dds.c
      - name: Confirm every datapath-only delay names both ends (patch 0009)
        run: |
          # "set_max_delay -datapath_only" without -from is an error, and an
          # .xdc drops such a line without a word in the build log - which is
          # how the bit-map flag's crossing went unconstrained until 0009.
          python3 - <<'PY'
          x = open("firmware/src/hdl/projects/pluto/system_constr.xdc").read()
          lines = x.replace("\\\n", " ").splitlines()
          cmds = [l for l in lines if l.lstrip().startswith("set_max_delay") and "-datapath_only" in l]
          bad = [l for l in cmds if "-from" not in l]
          assert cmds, "no datapath-only delays found at all"
          assert not bad, "missing -from: " + " | ".join(bad)
          print(len(cmds), "datapath-only delays, all with -from")
          PY
      - name: Confirm eth0 gets a stable MAC and a DHCP hostname (patch 0013)
        run: |
          # Without hwaddress the macb driver randomises the MAC every boot -
          # "invalid hw address, using random" - so the router sees a new
          # device each time and a DHCP reservation cannot be made. Without
          # the hostname line, udhcpc sends no DHCP option 12 and the router
          # has nothing to list the board as except that MAC.
          S=firmware/src/buildroot/board/pluto/S40network
          grep -q 'ETHADDR=`fw_printenv -n ethaddr' "$S"
          grep -q 'hwaddress ether \$ETHADDR' "$S"
          grep -q 'hostname \$HOSTNAME' "$S"
          # busybox ifupdown only turns these into "ip link set addr" and
          # "udhcpc -x hostname:" when they sit INSIDE the iface stanza, so the
          # blank line that ends it must come after them, not before.
          python3 - <<'PY'
          x = open("firmware/src/buildroot/board/pluto/S40network").read()
          blk = x[x.index('echo -e "auto eth0"'):]
          blk = blk[:blk.index("### /etc/wpa.conf ###")]
          for need in ("hostname $HOSTNAME", "hwaddress ether $ETHADDR"):
              assert need in blk, need + " is not in the eth0 stanza"
          assert blk.index('echo "" >> $IFAC') > blk.index("hwaddress"), \
              "the stanza is closed before its options are written"
          print("eth0 stanza carries hostname and hwaddress, in that order")
          PY
          # 0014 renames it again; assert the value 0014 leaves behind, since
          # patches are checked after the whole set has been applied.
          grep -q 'BR2_TARGET_GENERIC_HOSTNAME="fishball"' \
            firmware/src/buildroot/configs/zynq_pluto_defconfig
      - name: Confirm the USER LED follows the transmitter (patch 0012)
        run: |
          # The kernel half: a "tx-active" trigger driven from the one place
          # every attenuation change passes through.
          grep -q 'DEFINE_LED_TRIGGER(ad9361_tx_active_led)' \
            firmware/src/linux/drivers/iio/adc/ad9361.c
          grep -q 'led_trigger_register_simple("tx-active"' \
            firmware/src/linux/drivers/iio/adc/ad9361.c
          grep -q 'ad9361_tx_active_led_update(phy)' \
            firmware/src/linux/drivers/iio/adc/ad9361.c
          # The rootfs half: selected at boot, so the device tree stays
          # byte-for-byte identical to the factory one.
          grep -q 'echo tx-active' firmware/src/buildroot/board/pluto/S21misc
          grep -q 'tx_led$' firmware/src/buildroot/board/pluto/S21misc
          # ...and the .dtb must still ask for heartbeat, never tx-active.
          ! grep -q 'tx-active' \
            firmware/src/linux/arch/arm/boot/dts/zynq-pluto-sdr-fishball.dts

      # setup.sh deliberately skips patches/optional/. Check they still apply
      # anyway, so a worked example cannot rot against upstream unnoticed.
      - name: Confirm optional patches still apply cleanly
        run: |
          cd firmware/src
          for p in ../patches/optional/*.patch; do
            echo "checking $(basename "$p")"
            git apply --check "$p"
          done
