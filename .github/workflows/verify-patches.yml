name: Verify patches apply cleanly

# This does NOT run the actual firmware build (that needs Vivado,
# which can't reasonably run on a hosted GitHub Actions runner). It only
# checks the cheap, fast thing a hosted runner *can* verify: that
# setup.sh's clone-and-patch step still works. That catches upstream
# rewriting/force-pushing its history (setup.sh pins an exact commit, so
# this mainly guards against that commit disappearing) and catches any
# new patch in patches/ that doesn't actually apply - without needing an
# 80GB+ Vivado install in CI.

on:
  push:
    paths:
      - "firmware/patches/**"
      - "firmware/scripts/setup.sh"
      - ".github/workflows/verify-patches.yml"
  pull_request:
    paths:
      - "firmware/patches/**"
      - "firmware/scripts/setup.sh"
  schedule:
    # Weekly, so upstream disappearing/force-pushing is caught even when
    # nobody's actively touching this repo.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run setup.sh (clone upstream + apply patches)
        run: ./firmware/scripts/setup.sh
      - name: Confirm the device tree patch actually landed
        run: |
          test -f firmware/src/linux/arch/arm/boot/dts/zynq-pluto-sdr-fishball.dts
      - name: Confirm the TX safeguard and serial fallback landed
        run: |
          grep -q cf_axi_dds_tx_rf_mute firmware/src/linux/drivers/iio/frequency/cf_axi_dds.c
          grep -q ad9361_tx_lo_powerdown firmware/src/linux/drivers/iio/adc/ad9361.h
          grep -q 'mac_seed=' firmware/src/buildroot/board/pluto/S23udc
          grep -q ad9361_tx_is_muted firmware/src/linux/drivers/iio/adc/ad9361.h
          grep -q 'ad9361_tx_is_muted(phy) && ad9361_tx_mute' \
            firmware/src/linux/drivers/iio/frequency/cf_axi_dds.c
      - name: The generated FSBL inputs are complete (firmware/fsbl/)
        # These 21 files are committed because they cannot be fetched from
        # embeddedsw - they describe THIS hardware design, and regenerating them
        # needs the Vitis tooling that was removed on 2026-09-28. Every FSBL
        # build now consumes them, so one going missing breaks stage 2.
        #
        # This is a completeness check, NOT a staleness check. Whether they still
        # match the block design can only be answered against an XSA, which lives
        # under gitignored firmware/src/ and cannot exist on a hosted runner; that
        # check belongs in build_all.sh, where the XSA is present.
        run: |
          set -eu
          for f in xparameters.h bspconfig.h inbyte.c outbyte.c config.make Xilinx.spec; do
            test -f "firmware/fsbl/generated/$f" || { echo "missing firmware/fsbl/generated/$f" >&2; exit 1; }
          done
          n=$(ls firmware/fsbl/generated/config/*_g.c 2>/dev/null | wc -l)
          [ "$n" -eq 15 ] || { echo "expected 15 driver config tables, found $n" >&2; exit 1; }
          # every one must still be the HSI-generated article, not hand-edited
          for f in firmware/fsbl/generated/config/*_g.c; do
            grep -q 'automatically generated by HSI' "$f" || { echo "$f lost its HSI banner - hand-edited?" >&2; exit 1; }
          done
          # provenance must name the XSA these came from, or the staleness check
          # in build_all.sh has nothing to compare against
          grep -qE '^XSA +: md5 [0-9a-f]{32}' firmware/fsbl/provenance.txt
          echo "  21 generated FSBL inputs present, 15 config tables, provenance records an XSA"

      - name: Host tools use u-boot's own libfdt, not the system one (patch 0020)
        # Three forwarding headers in lib/libfdt/, which tools/Makefile already
        # searches BEFORE /usr/include. Without them a host with libfdt-dev
        # installed fails at tools/aisimage.o with conflicting fdt32_t/fdt64_t.
        run: |
          for h in libfdt.h libfdt_env.h fdt.h; do
            test -f "firmware/src/u-boot-xlnx/lib/libfdt/$h"
            grep -q '\.\./\.\./include/'"$h" "firmware/src/u-boot-xlnx/lib/libfdt/$h"
          done
          # and the rewrite that makes them necessary is still there, so a future
          # u-boot bump that drops it makes this patch dead weight, loudly
          grep -q 'idirafter' firmware/src/u-boot-xlnx/tools/Makefile

      - name: Patch 0021 wires channel 1 into the decimator, by default (source)
        # Upstream wires channel 1 straight to cpack, which leaves it sampled on
        # channel 0's valid with no anti-alias filter of its own the moment
        # decimation engages - 70 dB of aliasing on the second receiver. Assert
        # the wiring, not the channel COUNT: `8 4 1` alone would still pass if
        # someone asked for four channels and forgot to connect them.
        #
        # This reads the SOURCE, and says so in its name, because since 0021 the
        # script carries both wirings behind `if {$rx_filt_chan == 4}` - so these
        # greps prove the patch is applied and defaults to four channels, NOT
        # that any particular bitstream was built that way. What a build actually
        # did is in the generated system.bd, which verify_output.sh reads; CI has
        # no bitstream to check.
        run: |
          BD=firmware/src/hdl/projects/pluto/system_bd.tcl
          grep -q 'rx_fir_decimator/data_in_3'  "$BD"   # channel 1 Q goes IN
          grep -q 'rx_fir_decimator/data_out_3' "$BD"   # and comes back OUT to cpack
          grep -q 'rx_fir_decimator" 8 \$rx_filt_chan' "$BD"
          # the opt-out still exists and still defaults to both channels
          grep -q 'STOCK_RX_FILTER' "$BD"
          grep -q 'set rx_filt_chan 4' "$BD"
          echo "  both RX channels wired through rx_fir_decimator, STOCK_RX_FILTER opt-out present"

      - name: Confirm the GPIO lines are named in the device tree
        run: |
          grep -q gpio-line-names firmware/src/linux/arch/arm/boot/dts/zynq-pluto-sdr-fishball.dts
          grep -q sample_gpio0 firmware/src/linux/arch/arm/boot/dts/zynq-pluto-sdr-fishball.dts
      - name: Confirm the transmitter probes at maximum attenuation (patch 0011)
        run: |
          # 0x15E96 is 89750 mdB. The stock value is 0x2710 - 10 dB - which the
          # driver applies to BOTH channels in ad9361_setup(), both at every
          # boot and again on every debugfs "initialize". On a board that
          # reaches about +19 dBm that is roughly +9 dBm out of an SMA nobody
          # has necessarily terminated. This patch went untracked for a while
          # and shipped to nobody; the assertion is here so that cannot recur.
          grep -q 'adi,tx-attenuation-mdB = <0x15E96>' \
            firmware/src/linux/arch/arm/boot/dts/zynq-pluto-sdr-fishball.dts
      - name: Confirm the transmit starvation watchdog landed (patch 0015)
        run: |
          # postdisable is an event and events can be missed: a local process
          # killed mid-stream leaves buffer/enable at 1 and the transmitter
          # live. The watchdog keys off state instead - no DMA block for N ms.
          grep -q cf_axi_dds_tx_starve_arm \
            firmware/src/linux/drivers/iio/frequency/cf_axi_dds_buffer_stream.c
          grep -q tx_starve_timeout_ms \
            firmware/src/linux/drivers/iio/frequency/cf_axi_dds.c
          grep -q tx_cyclic_timeout_ms \
            firmware/src/linux/drivers/iio/frequency/cf_axi_dds.c
          # ... and the claim it disproves must not come back.
          ! grep -q 'real guarantee rather than best effort' \
            firmware/src/linux/drivers/iio/frequency/cf_axi_dds_buffer_stream.c
      - name: Confirm a large first block gets time to arrive (patch 0022)
        run: |
          # A large first block arrives after the buffer is enabled: a 4.4 MB
          # cyclic buffer (2 x 40 MS/s) was muted at 250 ms before its data
          # landed, which also switched the DAC to the DDS and looked like a
          # DMA underflow. The enable path must use the first-block grace.
          grep -q cf_axi_dds_tx_starve_arm_first firmware/src/linux/drivers/iio/frequency/cf_axi_dds.c
          grep -q 'cf_axi_dds_tx_starve_arm_first(st, indio_dev->buffer' firmware/src/linux/drivers/iio/frequency/cf_axi_dds_buffer_stream.c
          grep -q CF_AXI_DDS_TX_FIRST_BLOCK_MAX_MS firmware/src/linux/drivers/iio/frequency/cf_axi_dds.c
      - name: Confirm the transmit-disable latch landed (patch 0016)
        run: |
          grep -q 'tx_disable' firmware/src/linux/drivers/iio/adc/ad9361.c
          # The latch MUST live in struct ad9361_rf_phy, not in
          # ad9361_rf_phy_state: clear_state() memsets that, and the debugfs
          # "initialize" calls clear_state - so a latch kept there could be
          # cleared by the very surface it defends against. Measured.
          grep -q 'bool[[:space:]]*tx_disabled;' \
            firmware/src/linux/drivers/iio/adc/ad9361.h
          ! grep -q 'tx_disabled' firmware/src/linux/drivers/iio/adc/ad9361_private.h
      - name: Confirm the DMA counters and thermal limit landed (0017, 0018)
        run: |
          grep -q tx_dma_underflow_count \
            firmware/src/linux/drivers/iio/frequency/cf_axi_dds.c
          grep -q cf_axi_dds_dma_stat_poll \
            firmware/src/linux/drivers/iio/frequency/cf_axi_dds_buffer_stream.c
          grep -q tx_temp_limit firmware/src/linux/drivers/iio/adc/ad9361.c
          # Same rule as the latch: it must survive clear_state().
          grep -q 'tx_temp_limit;' firmware/src/linux/drivers/iio/adc/ad9361.h
      - name: Confirm the sample-locked GPIO feature landed
        run: |
          grep -q tx_gpio_bitmap firmware/src/hdl/projects/pluto/system_bd.tcl
          test -f firmware/src/hdl/projects/pluto/tx_gpio_bitmap.v
          grep -q 'PACKAGE_PIN  V10' firmware/src/hdl/projects/pluto/system_constr.xdc
          grep -q tx_sample_gpio_en firmware/src/linux/drivers/iio/frequency/cf_axi_dds.c
      - name: Confirm every datapath-only delay names both ends (patch 0009)
        run: |
          # "set_max_delay -datapath_only" without -from is an error, and an
          # .xdc drops such a line without a word in the build log - which is
          # how the bit-map flag's crossing went unconstrained until 0009.
          python3 - <<'PY'
          x = open("firmware/src/hdl/projects/pluto/system_constr.xdc").read()
          lines = x.replace("\\\n", " ").splitlines()
          cmds = [l for l in lines if l.lstrip().startswith("set_max_delay") and "-datapath_only" in l]
          bad = [l for l in cmds if "-from" not in l]
          assert cmds, "no datapath-only delays found at all"
          assert not bad, "missing -from: " + " | ".join(bad)
          print(len(cmds), "datapath-only delays, all with -from")
          PY
      - name: Confirm eth0 gets a stable MAC and a DHCP hostname (patch 0013)
        run: |
          # Without hwaddress the macb driver randomises the MAC every boot -
          # "invalid hw address, using random" - so the router sees a new
          # device each time and a DHCP reservation cannot be made. Without
          # the hostname line, udhcpc sends no DHCP option 12 and the router
          # has nothing to list the board as except that MAC.
          S=firmware/src/buildroot/board/pluto/S40network
          grep -q 'ETHADDR=`fw_printenv -n ethaddr' "$S"
          grep -q 'hwaddress ether \$ETHADDR' "$S"
          grep -q 'hostname \$HOSTNAME' "$S"
          # busybox ifupdown only turns these into "ip link set addr" and
          # "udhcpc -x hostname:" when they sit INSIDE the iface stanza, so the
          # blank line that ends it must come after them, not before.
          python3 - <<'PY'
          x = open("firmware/src/buildroot/board/pluto/S40network").read()
          blk = x[x.index('echo -e "auto eth0"'):]
          blk = blk[:blk.index("### /etc/wpa.conf ###")]
          for need in ("hostname $HOSTNAME", "hwaddress ether $ETHADDR"):
              assert need in blk, need + " is not in the eth0 stanza"
          assert blk.index('echo "" >> $IFAC') > blk.index("hwaddress"), \
              "the stanza is closed before its options are written"
          print("eth0 stanza carries hostname and hwaddress, in that order")
          PY
          # 0014 renames it again; assert the value 0014 leaves behind, since
          # patches are checked after the whole set has been applied.
          grep -q 'BR2_TARGET_GENERIC_HOSTNAME="fishball"' \
            firmware/src/buildroot/configs/zynq_pluto_defconfig
      - name: Confirm the USER LED follows the transmitter (patch 0012)
        run: |
          # The kernel half: a "tx-active" trigger driven from the one place
          # every attenuation change passes through.
          grep -q 'DEFINE_LED_TRIGGER(ad9361_tx_active_led)' \
            firmware/src/linux/drivers/iio/adc/ad9361.c
          grep -q 'led_trigger_register_simple("tx-active"' \
            firmware/src/linux/drivers/iio/adc/ad9361.c
          grep -q 'ad9361_tx_active_led_update(phy)' \
            firmware/src/linux/drivers/iio/adc/ad9361.c
          # The rootfs half: selected at boot, so the device tree stays
          # byte-for-byte identical to the factory one.
          grep -q 'echo tx-active' firmware/src/buildroot/board/pluto/S21misc
          grep -q 'tx_led$' firmware/src/buildroot/board/pluto/S21misc
          # ...and the .dtb must still ask for heartbeat, never tx-active.
          ! grep -q 'tx-active' \
            firmware/src/linux/arch/arm/boot/dts/zynq-pluto-sdr-fishball.dts

      # setup.sh deliberately skips patches/optional/. Check they still apply
      # anyway, so a worked example cannot rot against upstream unnoticed.
      - name: Confirm optional patches still apply cleanly
        run: |
          cd firmware/src
          for p in ../patches/optional/*.patch; do
            echo "checking $(basename "$p")"
            git apply --check "$p"
          done
