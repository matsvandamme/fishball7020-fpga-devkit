name: Host tools

# The host-side Python tooling has no hardware in CI, so this checks the parts
# that can be checked without a board: that everything imports and compiles on
# the Python versions people actually have, and that the self-test's
# measurement maths is right. A health check that reports the wrong dB figure
# is worse than no health check, so those numbers are asserted against signals
# whose answers are known exactly.

on:
  push:
    paths:
      - "tools/**"
      - "firmware/scripts/*.py"
      - "firmware/scripts/*.sh"
      - "devkit"
      - "firmware/sim/**"
      - "firmware/patches/**"
      - "firmware-modern/*.sh"
      - "firmware-modern/debian/write-card.sh"
      - "examples/**"
      - ".github/workflows/host-tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - "firmware/scripts/*.py"
      - "firmware/scripts/*.sh"
      - "devkit"
      - "firmware/sim/**"
      - "firmware/patches/**"
      - "firmware-modern/*.sh"
      - "firmware-modern/debian/write-card.sh"
      - "examples/**"
  workflow_dispatch:

jobs:
  host-tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Everything compiles
        run: python -m compileall -q tools firmware/scripts examples

      # Deliberately with no numpy installed: the pure-Python FFT fallback is
      # the path most users on a bare machine will take, so it is the one that
      # must be right.
      - name: Measurement maths, without numpy
        run: python tools/selftest/test_dsp.py

      # Executes the transmitter-safety behaviours rather than parsing them. Added
      # after rounds 7 and 8, where three HIGH defects were introduced by the previous
      # round's fixes and every one would have been caught by running the changed
      # branch once. sh -n and py_compile prove a file parses; this proves it behaves.
      - name: Transmitter-safety behaviours (no board)
        run: |
          python -m pip install --quiet numpy
          python tools/selftest/test_safety.py

      # ./devkit adsb's decoder: checksum, fields and positions against values
      # from an independent decoder (pyModeS), and the demodulator end to end
      # on synthetic 1090 MHz samples. No board, no antenna.
      - name: ADS-B decoder, on synthetic samples
        run: |
          python -m pip install --quiet numpy
          python tools/adsb/test_adsb.py

      # The two-target plumbing (#9): --target validation, the modern build's
      # refusals, import_xsa.sh on synthetic XSAs, the bootgen run-here probe
      # under pipefail, and tab completion. Asserts the REASON as well as the exit
      # code, because an unrelated earlier failure exits 1 too.
      - name: Two-target build plumbing (no board, no sources)
        run: python tools/selftest/test_targets.py

      # ./devkit's own surface: one-screen help, help <command>, typo hints,
      # --version, and every board command failing the same way with no board.
      - name: devkit help, typos and the no-board path
        run: python tools/selftest/test_devkit_cli.py

      # The Claude Code pane's collector with no board: still one JSON object,
      # every asked-for section present and only those, the board reported
      # offline rather than a traceback, and inside its own deadline.
      - name: Claude Code pane collector, with no board
        env:
          BOARD: 203.0.113.1
        run: |
          timeout 60 python tools/claude-pane/bin/collect.py --sections board,radio > pane.json
          python - <<'PY'
          import json
          d = json.load(open("pane.json"))
          assert d["sections"] == ["board", "radio"], d.get("sections")
          assert set(d) >= {"board", "radio"} and not set(d) & {"repo", "build"}, sorted(d)
          assert d["board"]["ok"] is False and d["board"]["online"] is False, d["board"]
          assert [l["name"] for l in d["board"]["links"]] == ["usb", "eth", "iio"]
          assert not any(l["up"] for l in d["board"]["links"]), d["board"]["links"]
          assert d["radio"]["ok"] is False, d["radio"]
          assert d["took_s"] < 20, d["took_s"]
          print("collect.py: no board -> offline, sections", d["sections"], "in", d["took_s"], "s")
          PY

      # The automation server's rules (request checks, busy refusals, capture,
      # stream accounting, never touching a transmitter): the real server and
      # client over localhost, with only the board faked.
      - name: Automation server, against a fake board
        if: matrix.python == '3.12'
        timeout-minutes: 5               # the tests take ~15 s; a hang must fail, not run on
        run: |
          python -m pip install --quiet -r tools/automation/requirements.txt
          python tools/automation/tests/test_automation.py
          python tools/automation/tests/test_beamformer.py

      - name: Measurement maths, with numpy
        run: |
          python -m pip install --quiet numpy
          python tools/selftest/test_dsp.py

      # The examples' embedded Python blocks. No radio and no GNU Radio needed
      # for the DSP half; the GRC half is skipped where gnuradio is absent.
      - name: The examples' DSP, and the .grc files are not stale
        run: |
          python -m pip install --quiet numpy pyyaml
          if python -c "import gnuradio" 2>/dev/null; then
            python examples/test_blocks.py
            python examples/mkgrc.py --check
          else
            echo "gnuradio not present - checking the parts that do not need it"
            python - <<'PY'
          import importlib.util, os, sys
          import numpy as np
          lib = os.path.join("examples", "lib")
          # qam.py is the shared constellation and imports nothing but numpy.
          spec = importlib.util.spec_from_file_location("qam", os.path.join(lib, "qam.py"))
          qam = importlib.util.module_from_spec(spec); spec.loader.exec_module(qam)
          for order in (4, 16, 64):
              pts = np.array(qam.points(order))
              assert len(pts) == order, order
              assert abs((np.abs(pts) ** 2).mean() - 1.0) < 1e-9, order
              assert qam.bits(order) == int(round(np.log2(order)))
          print("qam.py: %d orders, all unit mean power" % 3)
          PY
          fi

      - name: Every tool agrees on where the board is
        run: |
          # One resolver, so a board on its mDNS name is reachable by all of
          # them and not just whichever had the right address hard-coded.
          python tools/board_addr.py --self-test
          # Nothing may go back to assuming the USB address is the only one.
          ! grep -rn '192\.168\.2\.1' --include='*.py' tools/ \
              | grep -v 'board_addr.py' | grep -vi '# ' | grep 'default'
      - name: The self-test refuses to run without a board, rather than hanging
        run: |
          timeout 60 python tools/selftest/sdr_selftest.py --uri ip:203.0.113.1 \
            && { echo "should have failed"; exit 1; } || test $? -eq 2

      - name: FIR coefficient generator still designs a filter it stands behind
        run: python firmware/scripts/gen_fir_coe.py

  # The Claude Code pane (tools/claude-pane/) is a plugin of function hooks:
  # `claude plugin validate` reads its manifest and module the way Claude Code
  # will, and `claude plugin test` runs its tests against the real engine with
  # the collector faked. Neither needs a login. The plugin API is early access
  # and moves between releases, so this pins the version it was written
  # against; raise the pin on purpose, with TESTED in claude_pane.py, and run
  # the tests when you do.
  claude-pane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code, pinned
        run: npm install -g @anthropic-ai/claude-code@2.1.289
      - name: The plugin validates and its tests pass
        run: |
          claude plugin validate tools/claude-pane
          claude plugin test tools/claude-pane
      - name: devkit claude-pane start hands its options to Claude Code
        run: ./devkit claude-pane start --version | grep -F "(Claude Code)"

  hdl-sim:
    # Simulating the custom HDL needs only Icarus Verilog, so unlike synthesis
    # it runs perfectly well on a hosted runner - and it catches the class of
    # mistake synthesis cannot: logic that builds and meets timing but computes
    # the wrong thing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - name: Simulate against the golden model
        run: cd firmware && ./sim/run_sim.sh
      - name: Prove the testbench can still fail
        run: cd firmware && ./sim/run_sim.sh --mutate

  # The build script's preflight is the one part of it that can run without
  # Vivado, and the part a new user hits first. It once referenced a variable
  # it never set; under `set -u` every fresh clone died on line 112, while the
  # author's shells had it set by an earlier `source tools/env-vivado.sh` and
  # never saw it. So run it the way a new user does: an empty environment.
  build-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The build's preflight runs to the end in an empty environment
        run: |
          set -euo pipefail
          # A fake source tree: stamped with the real patch set, plus a Vivado
          # project older than its sources, so the checks that read patches/
          # and the coefficient files both actually execute.
          mkdir -p firmware/src/hdl/projects/pluto
          for p in firmware/patches/*.patch; do
              echo "$(sha256sum "$p" | cut -d' ' -f1)  $(basename "$p")"
          done > firmware/src/.devkit-patches-applied
          touch -d 2000-01-01 firmware/src/hdl/projects/pluto/pluto.xpr
          touch firmware/src/hdl/projects/pluto/system_bd.tcl

          run() { env -i HOME="$HOME" PATH=/usr/bin:/bin bash firmware/scripts/build_all.sh --preflight-only > out.txt 2>&1 || true; cat out.txt; }

          run
          ! grep -q "unbound variable" out.txt
          grep -q "newer than the existing Vivado project:.*system_bd.tcl" out.txt
          grep -q "newer than the existing Vivado project:.*coefile_" out.txt
          ! grep -q "is not applied" out.txt

          # A patch the stamp does not list must be caught.
          sed -i '$d' firmware/src/.devkit-patches-applied
          run
          grep -q "is not applied" out.txt

  # tools/write-card.cmd builds a whole SD card (FAT32 boot + ext3 root) in
  # embedded C#, for Windows users with nothing installed. It runs here under
  # Windows PowerShell 5.1 - the C# 5 compiler and the assemblies Add-Type
  # references there are what a user's PC has - once into an image file and
  # once into a virtual disk, which exercises the disk path for real: volume
  # locking, raw writes, the read-back, and Windows' own FAT driver reading the
  # boot partition. The next job checks the disk it wrote with e2fsprogs.
  write-card-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the latest release's card files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir rel
          tag=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          echo "release $tag"
          gh release download "$tag" --repo "${{ github.repository }}" --dir rel \
            -p BOOT.bin -p uImage -p devicetree.dtb -p uEnv.txt -p debian-rootfs.tar.gz -p SHA256SUMS
          cp tools/write-card.cmd rel/
      - name: Image file
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          Copy-Item rel\write-card.cmd "$env:RUNNER_TEMP\wc.ps1"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\wc.ps1" -Folder rel -ImageFile card.img -ImageSizeMB 1200 -NoPause
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: A virtual disk, written the way a card is
        shell: powershell
        run: |
          $vhd = "$env:RUNNER_TEMP\card.vhd"
          "create vdisk file=`"$vhd`" maximum=1200 type=fixed", "attach vdisk" | Set-Content dp.txt -Encoding ASCII
          diskpart /s dp.txt | Out-Null
          $d = Get-DiskImage -ImagePath $vhd | Get-Disk
          "virtual disk is disk $($d.Number), bus $($d.BusType)"
          $env:FISHBALL_WRITE_CARD_CI = '1'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\wc.ps1" -Folder rel -DiskNumber $d.Number -NoPause
          $rc = $LASTEXITCODE
          Get-Partition -DiskNumber $d.Number | Format-Table PartitionNumber, DriveLetter, Size, Type -AutoSize
          Dismount-DiskImage -ImagePath $vhd -ErrorAction SilentlyContinue | Out-Null
          if ($rc -ne 0) { exit 1 }
          Move-Item $vhd card.vhd
      - uses: actions/upload-artifact@v4
        with:
          name: write-card-output
          path: |
            card.img
            card.vhd
          retention-days: 3

  write-card-check:
    needs: write-card-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: write-card-output
      - name: Fetch the same release's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir rel
          tag=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          gh release download "$tag" --repo "${{ github.repository }}" --dir rel \
            -p BOOT.bin -p uImage -p devicetree.dtb -p uEnv.txt -p debian-rootfs.tar.gz -p SHA256SUMS
      - name: The embedded C# is still C# 5 (what Windows PowerShell 5.1 compiles)
        run: |
          mkdir cs5 && cd cs5
          python3 - <<'PY'
          s = open("../tools/write-card.cmd", newline="").read().replace("\r\n", "\n")
          a = s.index("$src = @'\n") + len("$src = @'\n")
          open("CardWriter.cs", "w").write(s[a:s.index("\n'@\n", a)])
          PY
          printf '%s\n' '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Library</OutputType>' \
            '<TargetFramework>net8.0</TargetFramework><LangVersion>5</LangVersion></PropertyGroup></Project>' > cs5.csproj
          dotnet build -nologo -v q
      - name: The image and the virtual disk match the release, entry by entry
        run: |
          sudo apt-get install -y -qq dosfstools e2fsprogs >/dev/null
          sudo python3 tools/check_card_image.py card.img rel
          sudo python3 tools/check_card_image.py card.vhd rel
