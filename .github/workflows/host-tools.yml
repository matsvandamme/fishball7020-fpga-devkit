name: Host tools

# The host-side Python tooling has no hardware in CI, so this checks the parts
# that can be checked without a board: that everything imports and compiles on
# the Python versions people actually have, and that the self-test's
# measurement maths is right. A health check that reports the wrong dB figure
# is worse than no health check, so those numbers are asserted against signals
# whose answers are known exactly.

on:
  push:
    paths:
      - "tools/**"
      - "firmware/scripts/*.py"
      - "firmware/scripts/*.sh"
      - "devkit"
      - "firmware/sim/**"
      - "firmware/patches/**"
      - ".github/workflows/host-tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - "firmware/scripts/*.py"
      - "firmware/scripts/*.sh"
      - "devkit"
      - "firmware/sim/**"
      - "firmware/patches/**"
  workflow_dispatch:

jobs:
  host-tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Everything compiles
        run: python -m compileall -q tools firmware/scripts examples

      # Deliberately with no numpy installed: the pure-Python FFT fallback is
      # the path most users on a bare machine will take, so it is the one that
      # must be right.
      - name: Measurement maths, without numpy
        run: python tools/selftest/test_dsp.py

      - name: Measurement maths, with numpy
        run: |
          python -m pip install --quiet numpy
          python tools/selftest/test_dsp.py

      # The examples' embedded Python blocks. No radio and no GNU Radio needed
      # for the DSP half; the GRC half is skipped where gnuradio is absent.
      - name: The examples' DSP, and the .grc files are not stale
        run: |
          python -m pip install --quiet numpy pyyaml
          if python -c "import gnuradio" 2>/dev/null; then
            python examples/test_blocks.py
            python examples/mkgrc.py --check
          else
            echo "gnuradio not present - checking the parts that do not need it"
            python - <<'PY'
          import importlib.util, os, sys
          import numpy as np
          lib = os.path.join("examples", "lib")
          # qam.py is the shared constellation and imports nothing but numpy.
          spec = importlib.util.spec_from_file_location("qam", os.path.join(lib, "qam.py"))
          qam = importlib.util.module_from_spec(spec); spec.loader.exec_module(qam)
          for order in (4, 16, 64):
              pts = np.array(qam.points(order))
              assert len(pts) == order, order
              assert abs((np.abs(pts) ** 2).mean() - 1.0) < 1e-9, order
              assert qam.bits(order) == int(round(np.log2(order)))
          print("qam.py: %d orders, all unit mean power" % 3)
          PY
          fi

      - name: Every tool agrees on where the board is
        run: |
          # One resolver, so a board on its mDNS name is reachable by all of
          # them and not just whichever had the right address hard-coded.
          python tools/board_addr.py --self-test
          # Nothing may go back to assuming the USB address is the only one.
          ! grep -rn '192\.168\.2\.1' --include='*.py' tools/ \
              | grep -v 'board_addr.py' | grep -vi '# ' | grep 'default'
      - name: The self-test refuses to run without a board, rather than hanging
        run: |
          timeout 60 python tools/selftest/sdr_selftest.py --uri ip:203.0.113.1 \
            && { echo "should have failed"; exit 1; } || test $? -eq 2

      - name: FIR coefficient generator still designs a filter it stands behind
        run: python firmware/scripts/gen_fir_coe.py

  hdl-sim:
    # Simulating the custom HDL needs only Icarus Verilog, so unlike synthesis
    # it runs perfectly well on a hosted runner - and it catches the class of
    # mistake synthesis cannot: logic that builds and meets timing but computes
    # the wrong thing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - name: Simulate against the golden model
        run: cd firmware && ./sim/run_sim.sh
      - name: Prove the testbench can still fail
        run: cd firmware && ./sim/run_sim.sh --mutate

  # The build script's preflight is the one part of it that can run without
  # Vivado, and the part a new user hits first. It once referenced a variable
  # it never set; under `set -u` every fresh clone died on line 112, while the
  # author's shells had it set by an earlier `source tools/env-vivado.sh` and
  # never saw it. So run it the way a new user does: an empty environment.
  build-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The build's preflight runs to the end in an empty environment
        run: |
          set -euo pipefail
          # A fake source tree: stamped with the real patch set, plus a Vivado
          # project older than its sources, so the checks that read patches/
          # and the coefficient files both actually execute.
          mkdir -p firmware/src/hdl/projects/pluto
          for p in firmware/patches/*.patch; do
              echo "$(sha256sum "$p" | cut -d' ' -f1)  $(basename "$p")"
          done > firmware/src/.devkit-patches-applied
          touch -d 2000-01-01 firmware/src/hdl/projects/pluto/pluto.xpr
          touch firmware/src/hdl/projects/pluto/system_bd.tcl

          run() { env -i HOME="$HOME" PATH=/usr/bin:/bin bash firmware/scripts/build_all.sh --preflight-only > out.txt 2>&1 || true; cat out.txt; }

          run
          ! grep -q "unbound variable" out.txt
          grep -q "newer than the existing Vivado project:.*system_bd.tcl" out.txt
          grep -q "newer than the existing Vivado project:.*coefile_" out.txt
          ! grep -q "is not applied" out.txt

          # A patch the stamp does not list must be caught.
          sed -i '$d' firmware/src/.devkit-patches-applied
          run
          grep -q "is not applied" out.txt
