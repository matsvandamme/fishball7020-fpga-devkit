name: Hardware

# Everything in the other workflows runs without a radio. This one needs the
# board, so it runs on a SELF-HOSTED runner on the machine the board is plugged
# into. It is what turns "verified once, by hand" into "verified on every push".
#
# ---------------------------------------------------------------------------
# SECURITY - read before registering a runner
# ---------------------------------------------------------------------------
# A self-hosted runner executes workflow code from this repository on your
# machine. GitHub's own guidance is not to use one on a PUBLIC repository
# without care, because anyone who opens a pull request can propose workflow
# changes, and on some settings those run.
#
# This workflow therefore:
#   * does NOT trigger on pull_request at all - only on pushes to main (which
#     only a collaborator can make) and on manual dispatch;
#   * never transmits at power: the self-test runs without --loopback, and the
#     GPIO check keeps TX attenuation at maximum and asserts it;
#   * leaves the board as it found it.
#
# Before enabling this, also set, in repo Settings -> Actions -> General:
#   "Fork pull request workflows from outside collaborators" = Require approval
#     for all outside collaborators.
#
# ---------------------------------------------------------------------------
# REGISTERING THE RUNNER (one time, on the machine with the board)
# ---------------------------------------------------------------------------
#   ./tools/setup-hardware-runner.sh
#
# That script fetches a registration token, installs the runner under
# ~/actions-runner-fishball with the label "fishball-board", and offers to run
# it as a service. Nothing here works until it has been run.

on:
  push:
    branches: [main]
    paths:
      - "firmware/patches/**"
      - "firmware/sim/**"
      - "firmware/scripts/**"
      - "tools/**"
      - "devkit"
      - ".github/workflows/hardware.yml"
  workflow_dispatch:
  schedule:
    # Once a week: catches a board that has drifted, a card that has rotted, or
    # firmware someone flashed by hand and forgot about.
    - cron: "0 6 * * 1"

concurrency:
  # One job at a time: there is one board, and two jobs would fight over it.
  group: fishball-hardware
  cancel-in-progress: false

jobs:
  hardware:
    # Gated on a repository variable, so this workflow is inert until a runner
    # actually exists. Without the gate the job sits QUEUED forever on every
    # push - GitHub has no runner to give it - and shows as a permanently
    # pending check. tools/setup-hardware-runner.sh sets the variable when it
    # registers the runner, and --remove clears it again.
    if: vars.HARDWARE_RUNNER == 'enabled'
    runs-on: [self-hosted, fishball-board]
    # 30 minutes of tests plus up to 30 of waiting for the board to be free.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Is the board there?
        run: |
          # fishball.local, not 192.168.2.1. The USB address is only right when
          # the board is reached over the USB gadget; on a board plugged into a
          # router the gadget link is down and 192.168.2.1 answers nothing, which
          # failed this job on 2026-09-28 with "no board at 192.168.2.1" while the
          # board was healthy on Ethernet. tools/board_addr.py exists for exactly
          # this and says so: reach for the NAME it announces over mDNS, never an
          # address anybody typed. BOARD= still overrides.
          BOARD="${BOARD:-fishball.local}"
          for i in $(seq 1 10); do
            ping -c1 -W1 "$BOARD" >/dev/null 2>&1 && { echo "board at $BOARD"; exit 0; }
            sleep 2
          done
          echo "no board at $BOARD - is it powered and enumerated?" >&2
          exit 1

      - name: Toolchain and prerequisites
        # ./devkit container doctor, not ./devkit doctor, because on this runner
        # the host deliberately CANNOT build: Vivado 2022.2 wants Ubuntu <= 22.04
        # and the machine is Arch, so everything builds in the pinned container
        # instead (docs/building-in-a-container.md). Host doctor therefore FAILS
        # on arm-linux-gnueabi-gcc and took this whole job down with it - while
        # the environment that actually builds here was green.
        #
        # The only soft-float arm-linux-gnueabi toolchain packaged for Arch is a
        # GCC 7.5 binary from 2020, against the container's 11. Installing it to
        # satisfy a check would make the check lie and invite exactly the silent
        # divergence build_all.sh:376-379 already documents for the FSBL.
        #
        # This still goes red if the build environment breaks, which is the point
        # of the step. It just asks the environment that does the building.
        run: ./devkit container doctor --target factory

      - name: HDL simulation and mutation testing
        run: ./devkit sim --mutate

      - name: Wait until nobody else is using the board
        # The board has one receive and one transmit buffer, and this machine is
        # also the bench: SDR++, chirp-view or a capture holding one made the
        # self-test fail with EBUSY, which read as a hardware regression. Wait
        # for both buffers to be off for 60 s in a row, up to 30 minutes; if
        # someone is still streaming then, fail saying who, not with EBUSY.
        run: tools/board-busy.sh --wait 1800 --quiet 60

      - name: Board self-test (no cable, never transmits)
        run: ./devkit selftest --ssh

      - name: Sample-locked GPIO outputs
        # Verifies the feature end to end on the pads, with TX attenuation
        # pinned at maximum and read back during every stream.
        run: ./devkit gpio-check

      - name: Is the board running what this tree builds?
        # This step FAILED on every run and reported green, for the whole time the
        # runner was registered - which is to say, from the first run onwards.
        #
        # `./devkit verify --target factory --board` compares the card against firmware/output/,
        # and this workflow runs in the runner's _work checkout, where output/ does
        # not exist because it is gitignored. So it printed nine FAILs and
        # "PROBLEMS FOUND - do not flash this build", and `continue-on-error: true`
        # turned that into a tick. A check that always fails and always looks green
        # is worse than no check: it teaches you to ignore the one place the answer
        # would appear.
        #
        # So it reads the real build tree, like release.yml does, and distinguishes
        # the two outcomes that were previously indistinguishable:
        #
        #   no build in that tree       -> a notice. Nothing is wrong; nobody has
        #                                  built here. Not a hardware fault.
        #   a build, and it is STALE    -> a WARNING, visible on the run summary
        #                                  rather than hidden behind a green tick.
        #
        # Still continue-on-error, because a stale board means it needs reflashing,
        # not that the tree is broken - but now the verdict is legible.
        continue-on-error: true
        run: |
          set -u
          B="${BUILD_TREE:-$HOME/fishball7020-fpga-devkit}"
          if [ ! -d "$B/firmware/output" ] || [ -z "$(ls -A "$B/firmware/output" 2>/dev/null | grep -v '^\.gitkeep$')" ]; then
            echo "::notice::no build in $B/firmware/output - nothing to compare the board against. Not a hardware fault."
            exit 0
          fi
          echo "  comparing the board against $B/firmware/output"
          # NOT the exit status. `verify --board` exits 0 when output/ is ready to
          # flash and reports the board comparison separately - so it returns 0 on
          # a stale board, and keying off $? would announce "the board is running
          # this build" when it is running something else. Read the verdict it
          # prints instead. (I wrote the exit-status version first; the board was
          # deliberately mixed at the time and it said everything matched.)
          out=$( cd "$B" && ./devkit verify --target factory --board 2>&1 ) || true
          echo "$out"
          # Three outcomes, not two. The card can also fail to mount - it is
          # left mounted by an interrupted flash often enough to matter - and
          # then nothing is compared and nothing prints STALE, so an else-branch
          # here announced "the board matches this build" on the strength of a
          # comparison that never ran. Check for the script's own statement that
          # it could not look before believing either of the other two.
          if echo "$out" | grep -q 'The board was NOT checked'; then
            echo "::warning::the card could not be read, so whether the board is running $B/firmware/output is unknown. Not a hardware fault, and not a failure of this check."
          elif echo "$out" | grep -q 'STALE'; then
            stale=$(echo "$out" | grep -c 'STALE')
            echo "::warning::$stale file(s) on the board differ from $B/firmware/output - it needs reflashing (./devkit flash --target factory). Not a hardware fault, and not a failure of this check."
          else
            echo "  the board matches this build"
          fi

      - name: MCP unit tests and protocol smoke test
        # The sibling MCP server talks to this board over IIOD, so a devkit change
        # can break it. This runs its tests when it can.
        #
        # It must use the MCP repo's OWN interpreter. `python3` on this machine has
        # no `mcp` module - that lives in ~/Fishball7020-mcp/.venv - and the first
        # run of this workflow after the runner was registered failed here with
        # `ModuleNotFoundError: No module named 'mcp'`, which reads as "the board
        # is broken" when nothing about the board is involved.
        #
        # And when the environment is simply not set up, this SKIPS rather than
        # fails. The step cannot tell "MCP is broken" from "MCP's venv is
        # missing", and turning the second into a red hardware check is a false
        # alarm about hardware. It says so loudly instead, with the command to fix
        # it, so a permanent skip is visible rather than silent.
        run: |
          set -u
          M="$HOME/Fishball7020-mcp"
          if [ ! -d "$M" ]; then
            echo "::notice::MCP checkout not found at $M - skipping"
            exit 0
          fi
          cd "$M"
          PY=python3
          [ -x .venv/bin/python3 ] && PY=.venv/bin/python3
          echo "  interpreter: $PY"
          if ! "$PY" -c 'import mcp' 2>/dev/null; then
            echo "::warning::the MCP tests were SKIPPED - $PY cannot import 'mcp'."
            echo "  This is not a board fault. Set the environment up with:"
            echo "      cd $M && python3 -m venv .venv && .venv/bin/pip install -e ."
            exit 0
          fi
          "$PY" evaluation/test_units.py
          "$PY" evaluation/smoke_test.py

      - name: Leave the transmitter quiet
        if: always()
        run: |
          BOARD="${BOARD:-fishball.local}"
          PASS="${BOARD_PASS:-analog}"
          command -v sshpass >/dev/null || exit 0
          sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR "root@$BOARD" '
            D=/sys/bus/iio/devices/iio:device0
            echo -89.75 > $D/out_voltage0_hardwaregain
            echo -89.75 > $D/out_voltage1_hardwaregain
            DDS=$(for d in /sys/bus/iio/devices/iio:device*; do
                    [ "$(cat $d/name)" = cf-ad9361-dds-core-lpc ] && echo $d; done; true)
            for ch in $DDS/out_altvoltage*_scale; do echo 0 > $ch 2>/dev/null; done
            echo "TX left at $(cat $D/out_voltage0_hardwaregain)"
          ' || true
